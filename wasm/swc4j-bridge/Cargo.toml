[package]
name = "swc4j_bridge"
version = "2.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
deno_ast = { version = "0.53.1", features = [
  "codegen",
  "compat",
  "emit",
  "proposal",
  "react",
  "scopes",
  "sourcemap",
  "transforms",
  "transpiling",
  "typescript",
  "utils",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
