buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        // saps.dev Maven (KubeJS and Rhino)
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
    maven {
        name = "Architectury"
        url "https://maven.architectury.dev/"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

def swc4jVersion = '2.1.0'
def swc4jNativeArtifacts = [
        'linux-arm64'    : 'swc4j-linux-arm64',
        'linux-x86_64'   : 'swc4j-linux-x86_64',
        'macos-arm64'    : 'swc4j-macos-arm64',
        'macos-x86_64'   : 'swc4j-macos-x86_64',
        'windows-arm64'  : 'swc4j-windows-arm64',
        'windows-x86_64' : 'swc4j-windows-x86_64',
]

def detectSwc4jPlatform = {
    def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def archName = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    def arch = ['aarch64', 'arm64'].contains(archName) ? 'arm64' : 'x86_64'

    if (osName.contains('win')) {
        return "windows-${arch}"
    }
    if (osName.contains('mac') || osName.contains('darwin')) {
        return "macos-${arch}"
    }
    if (osName.contains('linux')) {
        return "linux-${arch}"
    }
    throw new GradleException("Unsupported swc4j platform for os.name='${osName}', os.arch='${archName}'. Set -Pswc4jPlatforms explicitly.")
}

def swc4jPlatformsProperty = providers.gradleProperty('swc4jPlatforms').orElse(detectSwc4jPlatform()).get()
def swc4jPlatforms = swc4jPlatformsProperty == 'all'
        ? swc4jNativeArtifacts.keySet()
        : swc4jPlatformsProperty.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
def swc4jRuntimeArtifacts = ['swc4j'] + swc4jPlatforms.collect { platform ->
    def artifact = swc4jNativeArtifacts[platform]
    if (artifact == null) {
        throw new GradleException("Unknown swc4j platform '${platform}'. Expected one of ${swc4jNativeArtifacts.keySet()} or 'all'.")
    }
    artifact
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}") { transitive = false }
    implementation fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
    implementation fg.deobf("curse.maven:probejs-585406:5227399")

    swc4jRuntimeArtifacts.each { artifact ->
        implementation "com.caoccao.javet:${artifact}:${swc4jVersion}"
        jarJar "com.caoccao.javet:${artifact}:[${swc4jVersion},${swc4jVersion}]"
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jarJar.enable()

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            kubejs_version_range    : kubejs_version_range,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

tasks.named('jarJar').configure {
    finalizedBy 'reobfJarJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
