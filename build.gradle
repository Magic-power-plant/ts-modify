buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

def generatedSwc4jWasmResourcesDir = layout.buildDirectory.dir('generated/resources/swc4jWasm')

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir generatedSwc4jWasmResourcesDir
}

repositories {
    mavenCentral()
    maven {
        // saps.dev Maven (KubeJS and Rhino)
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
    maven {
        name = "Architectury"
        url "https://maven.architectury.dev/"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

def chicoryVersion = '1.7.5'
def swc4jWasmCrateDir = layout.projectDirectory.dir('wasm/swc4j-bridge')
def swc4jWasmBinary = swc4jWasmCrateDir.file('target/wasm32-wasip1/release/swc4j_bridge.wasm')
def cargoExecutable = providers.environmentVariable('CARGO')
        .orElse(providers.environmentVariable('USERPROFILE').map { "${it}\\.cargo\\bin\\cargo.exe" })
        .orElse('cargo')
def skipSwc4jWasm = providers.gradleProperty('skipSwc4jWasm')
        .map { it.toBoolean() }
        .orElse(false)

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}") { transitive = false }
    implementation fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
    implementation fg.deobf("curse.maven:probejs-585406:5227399")

    // Forge loads exploded development mods in a separate module layer. Chicory
    // must therefore be on ModLauncher's minecraft classpath, not only Gradle's
    // application classpath. minecraftLibrary also extends implementation.
    minecraftLibrary "com.dylibso.chicory:runtime:${chicoryVersion}"
    minecraftLibrary "com.dylibso.chicory:wasi:${chicoryVersion}"
    minecraftLibrary "com.dylibso.chicory:wasm:${chicoryVersion}"
    minecraftLibrary "com.dylibso.chicory:log:${chicoryVersion}"
    jarJar "com.dylibso.chicory:runtime:[${chicoryVersion},${chicoryVersion}]"
    jarJar "com.dylibso.chicory:wasi:[${chicoryVersion},${chicoryVersion}]"
    jarJar "com.dylibso.chicory:wasm:[${chicoryVersion},${chicoryVersion}]"
    jarJar "com.dylibso.chicory:log:[${chicoryVersion},${chicoryVersion}]"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('compileSwc4jWasm', Exec) {
    description = 'Compiles the SWC bridge to WebAssembly for the Java WASM runtime.'
    group = 'build'
    onlyIf { !skipSwc4jWasm.get() }
    workingDir swc4jWasmCrateDir
    commandLine cargoExecutable.get(), 'build', '--release', '--target', 'wasm32-wasip1'
    inputs.file swc4jWasmCrateDir.file('Cargo.toml')
    inputs.files fileTree(swc4jWasmCrateDir.dir('src')) {
        include '**/*.rs'
    }
    outputs.file swc4jWasmBinary
    doFirst {
        if (!swc4jWasmCrateDir.asFile.isDirectory()) {
            throw new GradleException("Missing SWC WASM crate: ${swc4jWasmCrateDir.asFile}")
        }
    }
}

tasks.register('processSwc4jWasmResources', Copy) {
    description = 'Copies the compiled SWC WebAssembly module into the main mod resources.'
    group = 'build'
    onlyIf { !skipSwc4jWasm.get() }
    dependsOn tasks.named('compileSwc4jWasm')
    from(swc4jWasmBinary)
    into generatedSwc4jWasmResourcesDir.map { it.dir('swc4j') }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('processSwc4jWasmResources')

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            kubejs_version_range    : kubejs_version_range,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

jarJar.enable()

tasks.named('jarJar').configure {
    finalizedBy 'reobfJarJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform {
        excludeTags 'performance'
    }
}

def rhinoStressReport = layout.buildDirectory.file('reports/rhino-stress/rhino-stress.json')
def rhinoBaselineStressReport = layout.buildDirectory.file('reports/rhino-stress/rhino-baseline-stress.json')
def rhinoStressJfr = layout.buildDirectory.file('reports/rhino-stress/rhino-stress.jfr')
def rhinoStressJfrRepository = layout.buildDirectory.dir('tmp/rhino-stress-jfr')

tasks.register('rhinoStressTest', JavaExec) {
    group = 'verification'
    description = 'Runs the TS Modify Rhino script-reload benchmark in an isolated optimized JVM.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.pingsu.rhino.benchmark.RhinoScriptReloadCachedBenchmarkMain'
    outputs.upToDateWhen { false }

    systemProperty 'tsmodify.rhino.scriptReload.report', rhinoStressReport.get().asFile.absolutePath
    systemProperty 'tsmodify.rhino.scriptReload.scriptCount', providers.gradleProperty('rhinoStressScriptReloadFileCount').orElse('128').get()
    systemProperty 'tsmodify.rhino.scriptReload.statementCount', providers.gradleProperty('rhinoStressScriptReloadStatementCount').orElse('512').get()
    systemProperty 'tsmodify.rhino.scriptReload.warmupRounds', providers.gradleProperty('rhinoStressWarmupRounds').orElse('5').get()
    systemProperty 'tsmodify.rhino.scriptReload.measurementRounds', providers.gradleProperty('rhinoStressMeasurementRounds').orElse('9').get()
    systemProperty 'tsmodify.rhino.scriptReload.cacheEnabled', 'true'
    systemProperty 'tsmodify.rhino.scriptReload.rhinoVersion', rhino_version

    if (providers.gradleProperty('rhinoStressJfr').isPresent()) {
        doFirst {
            rhinoStressJfr.get().asFile.parentFile.mkdirs()
            rhinoStressJfrRepository.get().asFile.mkdirs()
        }
        jvmArgs "-XX:FlightRecorderOptions=repository=${rhinoStressJfrRepository.get().asFile.absolutePath}"
        jvmArgs "-XX:StartFlightRecording=filename=${rhinoStressJfr.get().asFile.absolutePath},settings=profile,dumponexit=true"
    }
}

tasks.register('rhinoBaselineStressTest', JavaExec) {
    group = 'verification'
    description = 'Runs the no-TS-Modify Rhino script-reload benchmark in an isolated baseline JVM.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath.minus(sourceSets.main.output)
    mainClass = 'com.pingsu.rhino.benchmark.RhinoScriptReloadBenchmarkMain'
    outputs.upToDateWhen { false }

    systemProperty 'tsmodify.rhino.scriptReload.report', rhinoBaselineStressReport.get().asFile.absolutePath
    systemProperty 'tsmodify.rhino.scriptReload.scriptCount', providers.gradleProperty('rhinoStressScriptReloadFileCount').orElse('128').get()
    systemProperty 'tsmodify.rhino.scriptReload.statementCount', providers.gradleProperty('rhinoStressScriptReloadStatementCount').orElse('512').get()
    systemProperty 'tsmodify.rhino.scriptReload.warmupRounds', providers.gradleProperty('rhinoStressWarmupRounds').orElse('5').get()
    systemProperty 'tsmodify.rhino.scriptReload.measurementRounds', providers.gradleProperty('rhinoStressMeasurementRounds').orElse('9').get()
    systemProperty 'tsmodify.rhino.scriptReload.cacheEnabled', 'false'
    systemProperty 'tsmodify.rhino.scriptReload.rhinoVersion', rhino_version
}
